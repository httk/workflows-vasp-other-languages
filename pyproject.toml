[build-system]
requires = []
build-backend = "workflow_repository_build"
backend-path = ["tools"]

[project]
name = "workflows-vasp-other-languages"
dynamic = ["version"]
description = "The packaged VASP relaxation authored in Ada, C, C++, Fortran, Java, Perl, and Rust"
requires-python = ">=3.12"
dependencies = ["httk-workflow>=2.1.1", "httk-workflow-vasp>=0.1.0", "httk-atomistic>=2.1.2"]

[tool.httk.workflow-repository]
repository = "git+https://github.com/httk/workflows-vasp-other-languages"

[tool.ruff]
target-version = "py312"
src = ["tests"]
line-length = 120
